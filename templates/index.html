<!DOCTYPE html>
<html>
<head>
<title>Student API Interface</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #333;
        line-height: 1.5;
    }
    h1 { text-align: center; }
    hr { margin: 24px 0; border: none; border-top: 1px solid #ddd; }
    input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #greeting { font-weight: bold; color: #2563eb; }
</style>
</head>
<body>

<h1>Student API Interface</h1>

<button onclick="loadStudent()">Load Student Information</button>
<div id="result"></div>

<hr>

<h2>Greeting API</h2>
<input type="text" id="nameInput" placeholder="Enter your first name">
<button onclick="sayHello()">Say Hello</button>
<p id="greeting"></p>

<hr>

<h2>Grades API</h2>
<input type="text" id="studentIdInput" placeholder="Enter Student ID">
<button onclick="loadGrades()">View Grades</button>
<div id="gradesResult"></div>

<hr>

<h2>Students from Database</h2>
<button onclick="loadStudents()">Load Students</button>
<div id="studentList"></div>

<hr>

<h2>Students by Program</h2>

<input
    type="text"
    id="programInput"
    placeholder="Enter Program">

<button onclick="loadProgramStudents()">
    Search Program
</button>

<div id="programResult"></div>

<script>
function loadStudent() {
    fetch('/students/2024-00329')
        .then(response => response.json())
        .then(data => {
            document.getElementById('result').innerHTML =
                '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                '<p><b>Name:</b> ' + data.name + '</p>' +
                '<p><b>Program:</b> ' + data.program + '</p>' +
                '<p><b>Year:</b> ' + data.year + '</p>' +
                '<p><b>Section:</b> ' + data.section + '</p>';
        })
        .catch(error => {
            document.getElementById('result').innerHTML =
                '<p>Unable to retrieve data.</p>';
        });
}

function sayHello() {
    const name = document.getElementById('nameInput').value;
    fetch('/hello?name=' + encodeURIComponent(name))
        .then(response => response.json())
        .then(data => {
            document.getElementById('greeting').innerText = data.message;
        })
        .catch(error => {
            document.getElementById('greeting').innerText =
                'Unable to retrieve greeting.';
        });
}

function loadGrades() {
    const studentId = document.getElementById('studentIdInput').value;
    fetch('/grades?student_id=' + encodeURIComponent(studentId))
        .then(response => response.json())
        .then(data => {
            let html = '<h3>Student Grades</h3>' +
                       '<p><b>Student ID:</b> ' + data.student_id + '</p><ul>';
            for (const subject in data.grades) {
                html += '<li><b>' + subject + '</b>: ' + data.grades[subject] + '</li>';
            }
            html += '</ul>';
            document.getElementById('gradesResult').innerHTML = html;
        })
        .catch(error => {
            document.getElementById('gradesResult').innerHTML =
                '<p>Unable to retrieve grades.</p>';
        });
}

function loadStudents() {
    fetch('/students')
        .then(response => response.json())
        .then(data => {
            let output = '';
            data.forEach(student => {
                output +=
                    '<p>' +
                    '<b>' + student.student_id + '</b> - ' +
                    student.name + ' | ' +
                    student.program + ' | Year ' +
                    student.year + ' | Section ' +
                    student.section +
                    '</p>';
            });
            document.getElementById('studentList').innerHTML = output;
        })
        .catch(error => {
            document.getElementById('studentList').innerHTML =
                '<p>Unable to retrieve students.</p>';
        });
}

function loadProgramStudents() {

    const program =
        document.getElementById("programInput").value;

    fetch('/students/program/' + encodeURIComponent(program))
        .then(response => response.json())
        .then(data => {

            let output = '<div class="card">';

            data.forEach(student => {
                output += `
                    <p>
                        <b>${student.student_id}</b> -
                        ${student.name}
                        | Year ${student.year}
                        | Section ${student.section}
                    </p>
                `;
            });

            output += '</div>';

            document.getElementById('programResult').innerHTML =
                output;
        })
        .catch(error => {

            document.getElementById('programResult').innerHTML =
                '<p>Unable to retrieve records.</p>';
        });
}

</script>


</body>
</html>
