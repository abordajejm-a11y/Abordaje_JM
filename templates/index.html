<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            color: #333;
        }

        h1, h2 {
            color: #2563eb;
        }

        input {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }

        .card {
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f9f9f9;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Student API Interface</h1>

    <!-- ADD STUDENT -->
    <div class="section">
        <h2>Add Student</h2>

        <input type="text" id="student_id" placeholder="Student ID">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="program" placeholder="Program">
        <input type="number" id="year" placeholder="Year">
        <input type="text" id="section" placeholder="Section">

        <button onclick="addStudent()">
            Add Student
        </button>

        <p id="addResult"></p>
    </div>

    <!-- SEARCH STUDENT -->
    <div class="section">
        <h2>Search Student by Student ID</h2>

        <input
            type="text"
            id="searchId"
            placeholder="Enter Student ID (e.g. 2024-00329)"
        >

        <button onclick="getStudent()">
            Search Student
        </button>

        <div id="studentResult"></div>
    </div>

    <!-- LOAD ALL STUDENTS -->
    <div class="section">
        <h2>All Students</h2>

        <button onclick="loadStudents()">
            Load Students
        </button>

        <div id="studentList"></div>
    </div>

    <script>

        function addStudent() {

            const studentData = {
                student_id: document.getElementById('student_id').value.trim(),
                name: document.getElementById('name').value.trim(),
                program: document.getElementById('program').value.trim(),
                year: document.getElementById('year').value.trim(),
                section: document.getElementById('section').value.trim()
            };

            if (
                !studentData.student_id ||
                !studentData.name ||
                !studentData.program ||
                !studentData.year ||
                !studentData.section
            ) {
                document.getElementById('addResult').innerHTML =
                    '<span class="error">Please fill in all fields.</span>';
                return;
            }

            fetch('/api/students', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(studentData)
            })
            .then(response => response.json())
            .then(data => {

                document.getElementById('addResult').innerHTML =
                    `<span class="success">${data.message} (ID: ${data.id})</span>`;

                document.getElementById('student_id').value = '';
                document.getElementById('name').value = '';
                document.getElementById('program').value = '';
                document.getElementById('year').value = '';
                document.getElementById('section').value = '';
            })
            .catch(error => {

                document.getElementById('addResult').innerHTML =
                    '<span class="error">Error adding student.</span>';
            });
        }


        function getStudent() {

            const studentId =
                document.getElementById('searchId').value.trim();

            if (!studentId) {

                document.getElementById('studentResult').innerHTML =
                    '<p class="error">Please enter a Student ID.</p>';

                return;
            }

            fetch('/api/studentid/' + encodeURIComponent(studentId))
            .then(response => {

                if (!response.ok) {
                    throw new Error('Student not found');
                }

                return response.json();
            })
            .then(student => {

                document.getElementById('studentResult').innerHTML = `
                    <div class="card">
                        <p><strong>Database ID:</strong> ${student.id}</p>
                        <p><strong>Student ID:</strong> ${student.student_id}</p>
                        <p><strong>Name:</strong> ${student.name}</p>
                        <p><strong>Program:</strong> ${student.program}</p>
                        <p><strong>Year:</strong> ${student.year}</p>
                        <p><strong>Section:</strong> ${student.section}</p>
                    </div>
                `;
            })
            .catch(error => {

                document.getElementById('studentResult').innerHTML =
                    '<p class="error">Student not found.</p>';
            });
        }


        function loadStudents() {

            fetch('/api/students')
            .then(response => response.json())
            .then(data => {

                let output = '';

                data.forEach(student => {

                    output += `
                        <div class="card">
                            <p>
                                <strong>${student.student_id}</strong>
                                - ${student.name}
                            </p>

                            <p>
                                ${student.program}
                                | Year ${student.year}
                                | Section ${student.section}
                            </p>
                        </div>
                    `;
                });

                document.getElementById('studentList').innerHTML =
                    output;
            })
            .catch(error => {

                document.getElementById('studentList').innerHTML =
                    '<p class="error">Unable to load students.</p>';
            });
        }

    </script>

</body>
</html>
